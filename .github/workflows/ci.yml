name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Runs first and on a bare checkout: catches the failures that a working tree
  # hides -- files .gitignore swallowed, imports whose case only matters on
  # Linux, red lines quietly edited out. See scripts/audit.py for the history.
  audit:
    name: audit (repo-level invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/audit.py

  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      # Bare `pytest`, not `python -m pytest`: the two differ on sys.path, and
      # running the form CI uses is the point. pyproject sets pythonpath so
      # both work.
      - run: pytest -q

  study-app:
    name: study-app (tsc + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: study-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: study-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No warning budget: the i18n rule (FS-03) is an error, and a clean lint
      # is a release gate, not a nice-to-have.
      - run: npm run lint
      - run: npm run build
