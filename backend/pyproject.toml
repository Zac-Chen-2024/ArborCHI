[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scripts/import_project.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort. Kept deliberately small so that
# CI failures mean "this is broken", not "this is styled differently".
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length -- long prompt strings and Chinese comments
    "E402",  # module-level import not at top -- routers import lazily on purpose
    "E731",  # lambda assignment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:pydantic"]
# `python -m pytest` puts the working directory on sys.path; the bare `pytest`
# console script does not. tests/ has no __init__.py, so under bare `pytest`
# every `from app...` import failed to collect (exit code 2) -- which is what
# CI runs, and why it was red while local runs were green. Pinning the path
# here makes both invocations behave the same.
pythonpath = ["."]
